name: Test sast_scan_id and sca_scan_id inputs (rescan)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-key
          asoc_secret: fake-secret
          application_id: fake-app-id
          sast_scan_id: fake-sast-scan-id-1234
          sca_scan_id: fake-sca-scan-id-5678
          scan_name: test-rescan
      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials and fake scan IDs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
