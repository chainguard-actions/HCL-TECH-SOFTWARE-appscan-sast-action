name: Test open source only (SCA) mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in SCA-only mode (expect failure at auth)
        id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: 'invalid-key-for-testing'
          asoc_secret: 'invalid-secret-for-testing'
          application_id: 'invalid-app-id-for-testing'
          scan_name: 'test-sca-only-scan'
          open_source_only: 'true'
          scan_build_outputs: 'false'

      - name: Assert action failed as expected (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (not succeed) because credentials are invalid
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials in SCA-only mode, but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected in SCA-only mode (outcome=$OUTCOME)"
