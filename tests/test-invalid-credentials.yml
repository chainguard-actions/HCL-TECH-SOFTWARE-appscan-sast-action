name: Test invalid credentials fail gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: 'invalid-key-00000000-0000-0000-0000-000000000000'
          asoc_secret: 'invalid-secret-00000000-0000-0000-0000-000000000000'
          application_id: 'invalid-app-id-00000000-0000-0000-0000-000000000000'
          scan_name: 'test-scan-invalid-creds'
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
