name: Test optional boolean flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run AppScan SAST action with optional flags enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-api-key-for-testing
          asoc_secret: fake-api-secret-for-testing
          application_id: fake-application-id-for-testing
          scan_name: test-scan-optional-flags
          personal_scan: true
          static_analysis_only: true
          wait_for_analysis: false
          fail_for_noncompliance: false
          failure_threshold: Medium
          acceptssl: true
      - name: Assert action ran with optional flags (failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid, not because of bad input parsing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
