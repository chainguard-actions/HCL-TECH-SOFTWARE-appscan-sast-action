name: Test secrets-only scan mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in secrets-only mode (expect failure at download, not input parsing)
        id: action
        uses: .
        with:
          asoc_key: fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing
          scan_name: test-scan-secrets-only
          service_url: https://localhost:1
          secrets_only: true
          wait_for_analysis: false
        continue-on-error: true
      - name: Assert action did not succeed
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly did not succeed when given invalid credentials in secrets-only mode (outcome=$OUTCOME)"
