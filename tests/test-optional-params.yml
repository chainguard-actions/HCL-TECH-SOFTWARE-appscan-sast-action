name: Test optional parameters are accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all optional parameters
        id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing
          service_url: http://localhost:19999
          scan_name: test-scan
          personal_scan: false
          static_analysis_only: true
          open_source_only: false
          scan_build_outputs: false
          wait_for_analysis: false
          analysis_timeout_minutes: 15
          fail_for_noncompliance: false
          failure_threshold: Medium
          acceptssl: false

      - name: Assert action ran (failed at API level, not config level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to network/auth issues, not due to bad config
          # If it fails, that's expected (no real AppScan service available)
          # If it somehow succeeds, that's also acceptable
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with optional parameters (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
