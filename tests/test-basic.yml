name: Test basic usage - required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run AppScan SAST action with required inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-api-key-for-testing
          asoc_secret: fake-api-secret-for-testing
          application_id: fake-application-id-for-testing
      - name: Assert action ran (failed due to invalid credentials, not missing inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because inputs are missing)
          # A failure here means the action at least started and attempted to connect
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
