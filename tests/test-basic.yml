name: Test basic usage - invalid credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing
          scan_name: test-scan
      - name: Assert action ran and failed with expected error (not a setup/config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because credentials are invalid (not because of missing inputs)
          # A 'failure' outcome means the action ran and attempted to connect
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (maybe a mock environment?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid credentials"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
