name: Test EU region key routing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When asoc_key starts with 'eu-central', the action routes to the EU endpoint
      # (https://cloud.appscan.com/eu). This tests the settings.js EU routing logic.
      # The action will fail due to fake credentials, but should fail gracefully
      # (network/auth error) rather than crashing with a JS exception.
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: eu-central-fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing
          scan_name: test-scan-eu-region

      - name: Assert action failed (expected — no real AppScan EU credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake EU credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with fake EU credentials"

      - name: Assert conclusion is success (continue-on-error overrides conclusion)
        env:
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion=success (continue-on-error), got $CONCLUSION"
            exit 1
          fi
          echo "PASS: conclusion is success as expected (continue-on-error was set)"
