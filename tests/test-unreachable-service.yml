name: Test unreachable service URL fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: 'test-key-00000000-0000-0000-0000-000000000000'
          asoc_secret: 'test-secret-00000000-0000-0000-0000-000000000000'
          application_id: 'test-app-id-00000000-0000-0000-0000-000000000000'
          service_url: 'https://invalid.nonexistent.appscan.example.invalid'
          scan_name: 'test-scan-unreachable'
      - name: Assert action failed due to unreachable service
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable service, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with unreachable service URL"
