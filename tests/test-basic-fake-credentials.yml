name: Test basic usage with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires real AppScan credentials and will fail to connect.
      # We verify it fails gracefully (via core.setFailed) rather than crashing
      # with an unhandled JS exception (which would produce a different exit code/message).
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing

      - name: Assert action failed (expected — no real AppScan credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with fake credentials"

      - name: Assert conclusion is success (continue-on-error overrides conclusion)
        env:
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion=success (continue-on-error), got $CONCLUSION"
            exit 1
          fi
          echo "PASS: conclusion is success as expected (continue-on-error was set)"
