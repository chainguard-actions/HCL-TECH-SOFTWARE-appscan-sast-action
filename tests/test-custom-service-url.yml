name: Test custom service URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom service URL (expect failure - unreachable)
        id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: 'invalid-key-for-testing'
          asoc_secret: 'invalid-secret-for-testing'
          application_id: 'invalid-app-id-for-testing'
          service_url: 'https://invalid.appscan.example.com'
          scan_name: 'test-custom-url-scan'
          acceptssl: 'false'

      - name: Assert action failed as expected (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (not succeed) because the service URL is unreachable
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with unreachable service URL, but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected with custom service URL (outcome=$OUTCOME)"
