name: Test custom service URL input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts a custom service_url input and fails gracefully
      # when it cannot connect to the specified URL. This exercises the settings.js
      # getServiceUrl() logic for custom service URLs (non-default endpoint).
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: fake-key-for-testing
          asoc_secret: fake-secret-for-testing
          application_id: fake-app-id-for-testing
          service_url: https://custom.appscan.example.com
          scan_name: test-scan-custom-url

      - name: Assert action failed (expected — custom URL is unreachable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable custom URL, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with unreachable custom service URL"

      - name: Assert conclusion is success (continue-on-error overrides conclusion)
        env:
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected conclusion=success (continue-on-error), got $CONCLUSION"
            exit 1
          fi
          echo "PASS: conclusion is success as expected (continue-on-error was set)"
