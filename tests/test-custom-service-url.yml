name: Test custom service_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts and uses a custom service_url.
      # The action will fail because the URL is not a real AppScan service,
      # but we verify the action starts and fails at the network level.
      - id: action
        uses: .
        continue-on-error: true
        with:
          asoc_key: 'fake-key-for-testing'
          asoc_secret: 'fake-secret-for-testing'
          application_id: 'fake-app-id-for-testing'
          service_url: 'https://localhost:19999'

      - name: Assert action ran and failed at network level (not a JS startup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because localhost:19999 is not a real AppScan service.
          # We accept either 'failure' (expected) or 'success' (if somehow connected).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran and produced a valid outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' - action may not have started"
            exit 1
          fi
